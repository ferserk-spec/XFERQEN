<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XFERQEN | Mis redes y juegos</title>
<meta name="description" content="Página oficial de XFERQEN. Encuentra mis redes sociales, mi comunidad y los juegos donde puedes seguirme.">

<meta property="og:title" content="XFERQEN | Mis redes y juegos">
<meta property="og:description" content="Página oficial de XFERQEN. Encuentra mis redes sociales, mi comunidad y los juegos donde puedes seguirme.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/profile.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scene" aria-hidden="true">
  <div class="scene__overlay"></div>
  <div class="scene__grain"></div>
</div>

<main class="page">

  <!-- ===================== PERFIL ===================== -->
  <header class="profile" data-reveal>
    <div class="profile__avatar" id="avatar">
      <img src="assets/profile.png" alt="Foto de perfil de XFERQEN" id="avatarImg">
      <span class="profile__avatar-fallback" aria-hidden="true">X</span>
      <span class="profile__ring"></span>
    </div>

    <h1 class="profile__hello">¡Hola / Hi!</h1>
    <p class="profile__sub">¡BIENVENIDO / WELCOME!</p>

    <div class="profile__glyph" aria-hidden="true">&lt;/&gt;</div>
  </header>

  <!-- ===================== REDES SOCIALES ===================== -->
  <section class="section" aria-labelledby="social-heading" data-reveal>
    <h2 class="section__title" id="social-heading">Redes</h2>
    <ul class="link-list" id="socialList"><!-- generado por script.js --></ul>
  </section>

  <!-- ===================== MIS JUEGOS ===================== -->
  <section class="section" aria-labelledby="games-heading" data-reveal>
    <h2 class="section__title" id="games-heading">Mis creaciones</h2>
    <div class="game-grid">

      <a class="game-card game-card--minecraft" id="minecraftCard" href="#" target="_blank" rel="noopener noreferrer" aria-label="Minecraft">
        <span class="game-card__icon" aria-hidden="true">
          <img src="assets/minecraft.png" alt="" id="minecraftIcon">
          <span class="game-card__icon-fallback">⛏</span>
        </span>
        <span class="game-card__name">Minecraft</span>
      </a>

      <button class="game-card game-card--other" id="otherGamesBtn" type="button" aria-haspopup="dialog" aria-controls="gamesModal">
        <span class="game-card__icon" aria-hidden="true">
          <span class="game-card__icon-fallback">✚</span>
        </span>
        <span class="game-card__name">Nueva creacion</span>
      </button>

    </div>
  </section>

  <!-- ===================== FOOTER ===================== -->
  <footer class="footer" data-reveal>
    <p class="footer__text">CREADOR XFERQEN</p>
    <span class="footer__pulse" aria-hidden="true"></span>
  </footer>

</main>

<!-- ===================== MODAL OTROS JUEGOS ===================== -->
<div class="modal" id="gamesModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
  <div class="modal__backdrop" id="modalBackdrop"></div>
  <div class="modal__panel">
    <div class="modal__head">
      <h2 class="modal__title" id="modalTitle">Nueva creacion</h2>
      <button class="modal__close" id="modalClose" type="button" aria-label="Cerrar">✕</button>
    </div>
    <div class="modal__body" id="modalBody"><!-- generado por script.js --></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
